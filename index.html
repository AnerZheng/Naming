.tutbtn{min-height:44px;padding:0 22px;border-radius:8px;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
#block{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:10;padding:24px;text-align:center;font-size:20px;line-height:1.5}

// Grid cells of a disc, sized so that exactly N figures fill the circle.
function discCells(N,D){

    all.sort((a,b)=>a.d-b.d);
    if(all.length>=N&&all[N-1].d<=C-FH*0.6)return{cells:all.slice(0,N),FW,FH};

    ['title','Welcome! This is a life simulation game.'],
    ['fig','In the game, you are a parent expecting a child.'],
    ['hoods','You will move 8 times, to 8 different neighborhoods.'],
    ['goal','In each neighborhood, you choose a name for your child. There are no right or wrong answers.']]},
  {build:tutMoveIn,steps:[
    ['badge','Step 1 · Move in. Each round starts when you move into a new neighborhood. This shows which of the 8 you are in.'],
    ['code','Neighborhoods are numbered #1 to #8, in the order you visit them.'],
    ['text','Here you learn whether you are expecting a daughter or a son, and how many children were born there.'],
    ['btn','Then click “Look around” to see the neighborhood.']]},
  {build:()=>tutRound('look'),steps:[
    ['title','Step 2 · Look around. In each neighborhood, only some of the children’s names are made public, and you can see only the public names.'],
    ['legpub','Coloured human icons are children whose names are public. Each colour stands for one name.'],
    ['leghid','Grey human icons are children whose names are not public.'],
    ['disc','Each human icon in the circle is one child born in this neighborhood. The colours show which public names there are and how they are spread across the neighborhood.'],
    ['disc','Move your mouse over the circle: the names of the coloured children under the mouse appear beside it. Try it now.','try'],
    ['btn','After at least 15 seconds, “Go to choice” unlocks, and you click it.']]},
  {build:()=>tutRound('choose'),practice:true,steps:[
    ['title','Step 3 · Choose. Now you choose a name for your own child.'],
    ['disc','This is the same circle you saw before, shown again.'],
    ['grid','These are the public names you just saw in the circle, one for each colour. Choose the name you would really give your own child. You can change your pick before you continue.'],
    ['btn','Then click “Continue” to move on to the next neighborhood.']],
   end:'Your turn: click any name, then click “Continue”. This is only practice and is not saved.'}];
const MIN_STEP_MS=1000; // each step stays at least 1 s before "I understand" can be clicked
const tutLog=[]; // "page.step:ms" = when each step was confirmed, ms since the tutorial started
function tutorialPage(n){
  logScreen(`tutorial ${n+1}`);const T=TUT[n],page=T.build();page.style.position='relative';page.style.overflow='hidden';app.replaceChildren(page);
  const block=h(`<div style="position:absolute;inset:0;z-index:4"></div>`);
  const spot=h(`<div style="position:absolute;z-index:5;left:409px;top:490px;width:0;height:0;border-radius:12px;pointer-events:none;outline:3px solid #FFE119;box-shadow:0 0 0 2000px rgba(20,30,36,.45);transition:all .5s ease"></div>`);
  const card=h(`<div style="position:absolute;z-index:6;left:110px;width:599px;box-sizing:border-box;padding:18px 22px;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(20,30,36,.3);font-size:20px;line-height:1.45;color:var(--ink);visibility:hidden">
    <div class="tm" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#56656C;margin-bottom:6px"></div>
    <div class="tx"></div><div class="tb" style="display:flex;justify-content:flex-end;margin-top:14px"></div></div>`);
  page.append(block,spot,card);
  const tm=card.querySelector('.tm'),tx=card.querySelector('.tx'),tb=card.querySelector('.tb');
  const ok=h(`<button class="tutbtn" style="border:none;background:var(--accent);color:#fff">I understand</button>`);tb.append(ok);
  const rect=el=>{const p=page.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:(r.left-p.left)/scale,y:(r.top-p.top)/scale,w:r.width/scale,h:r.height/scale}};
  const say=(text,r,label)=>{tm.textContent=label;tx.textContent=text;tx.style.animation='none';void tx.offsetWidth;tx.style.animation='tutfade .4s ease';
    card.style.visibility='visible';const ch=card.offsetHeight,below=r.y+r.h+24;
    card.style.top=(below+ch<=964?below:Math.max(16,r.y-24-ch))+'px'};
  const confirm=()=>new Promise(res=>{ok.disabled=true;ok.style.opacity=.5;
    setTimeout(()=>{ok.disabled=false;ok.style.opacity=1},MIN_STEP_MS);ok.onclick=()=>{if(!ok.disabled)res()}});
  (async()=>{
    for(let i=0;i<T.steps.length;i++){
      const [t,text,mode]=T.steps[i],tgt=page.querySelector(`[data-t="${t}"]`),r=rect(tgt);
      page.querySelectorAll('[data-t]').forEach(e=>{e.style.zIndex='';e.dispatchEvent(new Event('mouseleave'))}); // also clears name tags
      if(mode==='try')tgt.style.zIndex=5; // a "try" step lets the mouse reach the target above the blocking layer
      tb.style.visibility='hidden';
      Object.assign(spot.style,{left:r.x-8+'px',top:r.y-8+'px',width:r.w+16+'px',height:r.h+16+'px'});await wait(400);
      say(text,r,`Tutorial ${n+1} of ${TUT.length} · step ${i+1} of ${T.steps.length}`);logScreen(`tutorial ${n+1}.${i+1}`);tb.style.visibility='visible';
      await confirm();tutLog.push(`${n+1}.${i+1}:${Math.round(performance.now()-tutT0)}`)}
    if(!T.practice){n+1<TUT.length?tutorialPage(n+1):startPage();return}
    const g=rect(page.querySelector('[data-t="grid"]'));
    Object.assign(spot.style,{left:g.x-8+'px',top:g.y-8+'px',width:g.w+16+'px',height:g.h+16+'px'});
    say(T.end,g,`Tutorial ${n+1} of ${TUT.length} · your turn`);logScreen(`tutorial ${n+1}.practice`);tb.style.visibility='hidden';block.style.display='none';
    const btn=page.querySelector('[data-t="btn"]');
    page.querySelector('.stage').addEventListener('change',()=>{btn.disabled=false});
    btn.onclick=()=>{tutLog.push(`${n+1}.practice:${Math.round(performance.now()-tutT0)}`);tutorialSec=+((performance.now()-tutT0)/1000).toFixed(1);startPage()};
  })()}
// ===== Replay: re-run a recorded session in this same page code =====
// The participant's seed and link parameters make every screen identical; recorded clicks and typing are played
// back at their original times, and a pointer shows the recorded mouse. Nothing is sent anywhere.
function startReplay(){
  window.fetch=async()=>({ok:true});
  const E=REPLAY.events,end=E.length?E[E.length-1][0]:0;
  const shield=h(`<div style="position:fixed;inset:0;z-index:50;cursor:not-allowed"></div>`);
  const cur=h(`<svg width="26" height="30" viewBox="0 0 26 30" style="position:fixed;z-index:51;left:-40px;top:0;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))"><path d="M2 2 L2 24 L8 18.5 L12 28 L16.5 26 L12.5 16.8 L20.5 16.8 Z" fill="#fff" stroke="#D62728" stroke-width="2" stroke-linejoin="round"/></svg>`);
  const bar=h(`<div style="position:fixed;left:0;right:0;top:0;z-index:52;display:flex;gap:14px;align-items:center;background:#1C2830;color:#fff;font:13px 'IBM Plex Mono',monospace;padding:6px 12px"><span class="st">Replay</span><span style="flex:1"></span>Speed ${[1,2,4,8,16].map(s=>`<button data-s="${s}" style="font:inherit;padding:2px 8px;border-radius:4px;border:1px solid #7FA9BC;background:${s===1?'#7FA9BC':'transparent'};color:#fff;cursor:pointer">${s}×</button>`).join('')}</div>`);
  const st=bar.querySelector('.st');
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{setReplaySpeed(+b.dataset.s);bar.querySelectorAll('button').forEach(x=>x.style.background=x===b?'#7FA9BC':'transparent')});
  document.body.append(shield,cur,bar);
  const toClient=(x,y)=>{const r=app.getBoundingClientRect();return[r.left+x*scale,r.top+y*scale]};
  const clickAt=(x,y,tries=0)=>{const [cx,cy]=toClient(x,y);shield.style.display='none';const el=document.elementFromPoint(cx,cy);shield.style.display='';
    const t=el&&(el.closest('button,label,input,select')||el);if(!t)return;
    if(t.disabled&&tries<60){setTimeout(()=>clickAt(x,y,tries+1),50);return} // a timer-locked button: wait for it, as the participant did
    if(t.tagName!=='SELECT')t.click();
    const rp=h(`<span style="position:fixed;z-index:51;left:${cx-14}px;top:${cy-14}px;width:28px;height:28px;border-radius:50%;border:3px solid #D62728;pointer-events:none;animation:tutclick .5s ease-out forwards"></span>`);document.body.append(rp);setTimeout(()=>rp.remove(),600)};
  // Recorded mouse moves are sent to the circle under the pointer, so the name lens shows what the participant saw.
  let hovered=null;
  const hoverAt=(cx,cy)=>{shield.style.display='none';const el=document.elementFromPoint(cx,cy);shield.style.display='';
    const d=el&&el.closest('.disc');
    if(hovered&&hovered!==d)hovered.dispatchEvent(new Event('mouseleave'));
    hovered=d;if(d)d.dispatchEvent(new MouseEvent('mousemove',{clientX:cx,clientY:cy}))};
  // A click or input is applied only once the same screen is showing as when it was recorded; any wait for that
  // shifts the rest of the timeline, so the time between actions stays as recorded.
  // The recording starts at the participant's first click, ms_after_page_load after the page opened: start the clock there.
  const meta=JSON.parse((E.find(e=>e[2]==='meta')||[,,,,,'{}'])[5]);
  const t0=performance.now()+(meta.ms_after_page_load||0);let i=0,screenNow='',shift=0,pauseStart=0;
  const loop=()=>{const t=performance.now()-t0-shift;
    for(;i<E.length&&E[i][0]<=t;i++){const [,s,type,x,y,d]=E[i];
      if((type==='c'||type==='i')&&s!==curScreen){if(!pauseStart)pauseStart=performance.now();if(performance.now()-pauseStart<8000)break}
      if(pauseStart){shift+=performance.now()-pauseStart;pauseStart=0}
      screenNow=s;
      if(type==='m'||type==='c'||type==='d'){const [cx,cy]=toClient(+x,+y);cur.style.left=cx-2+'px';cur.style.top=cy-2+'px';hoverAt(cx,cy)}
      if(type==='c')clickAt(+x,+y);
      if(type==='i'){const k=d.indexOf('='),el=document.getElementById(d.slice(0,k));
        if(el){el.value=d.slice(k+1);el.dispatchEvent(new Event('input',{bubbles:true}));if(el.tagName==='SELECT')el.dispatchEvent(new Event('change',{bubbles:true}))}}}
    st.textContent=`Replay · ${(t/1000).toFixed(1)} s / ${(end/1000).toFixed(1)} s · ${screenNow} · ${SPEED}×`;
    if(i<E.length)setTimeout(loop,15);else st.textContent+=' · finished'};
  setTimeout(loop,15)}
fit();
tutorialPage(0);
if(REPLAY)startReplay();
</script>
