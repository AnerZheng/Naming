<style>

body{display:flex;justify-content:center;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden}

button.go{min-height:60px;padding:0 36px;border:none;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-size:22px;font-weight:600;cursor:pointer;align-self:flex-end}
button.go:disabled{background:#A9B6BC;cursor:not-allowed}
.num{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:var(--accent);color:#fff;font-weight:600;font-size:20px;line-height:40px;text-align:center}
.pill{position:absolute;width:110px;height:32px;margin:-16px 0 0 -55px;box-sizing:border-box;display:flex;align-items:center;gap:5px;padding:0 7px;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:18px;cursor:pointer}
.pill:has(input:checked){border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(46,94,116,.15)}
.tag{position:absolute;box-sizing:border-box;height:35px;padding:1px 9px;font-size:20px;line-height:28px;font-weight:600;white-space:nowrap;color:var(--ink);background:#fff;border:2.5px solid;border-radius:15px;box-shadow:0 2px 6px rgba(28,40,48,.15);pointer-events:none}
.lead{position:absolute;height:2px;margin-top:-1px;transform-origin:0 50%;pointer-events:none}
#block{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:10;padding:24px;text-align:center;font-size:20px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ===== Settings =====
const DATAPIPE_ID='AbBzDwVVFD2y';
const VERSION=1;
const MIN_SCALE=0.7; // smallest allowed zoom of the 819x980 page
// ====================
const ROUNDS=JSON.parse(atob('W3siY29kZSI6IjdrMnA5ciIsIk4iOjE3NDAsIlAiOjMwMywiZ3JvdXBzIjpbWyJBaW1lZSIsMiw5LDRdLFsiRWxsaWUiLDIsOSw2XSxbIkpheWx5bm4iLDEsNiwxXSxbIkFubmlrYSIsMjA3LDEyMzIsMTVdLFsiTGlsbGlhbmEiLDIsMTAsOF0sWyJNYWxlYWgiLDAsOSwxMV0sWyJOeWxhaCIsMiw5LDEwXSxbIlN1bW1lciIsMCw1LDldLFsiU2hlbGJ5IiwyNyw5NCwxM10sWyJBc3BlbiIsMCwxMSw1XSxbIk1hZGlzeW4iLDIsOCwyXSxbIkFpbnNsZXkiLDEsNyw3XSxbIkthdGhsZWVuIiwwLDYsM10sWyJBbmdlbCIsNTIsMzAxLDE0XSxbIkRlbGlsYWgiLDUsMjQsMTJdXX0seyJjb2RlIjoiNWI4dDF3IiwiTiI6MTgzMywiUCI6Mjk5LCJncm91cHMiOltbIkxpbGxpZSIsMjIsMTIwLDEyXSxbIkFsbGllIiwxNywxMjUsOV0sWyJWaXZpYW5hIiwyNCwxMTgsOF0sWyJKdWxpZXR0ZSIsMjIsMTA3LDNdLFsiQW5peWFoIiwxOSwxMjQsMV0sWyJUaWFuYSIsMTksMTI1LDEzXSxbIkNhc2V5IiwyMiwxMTYsMTVdLFsiTmF0YXNoYSIsMjIsMTM5LDExXSxbIkFubmFiZWxsZSIsMTUsMTIwLDRdLFsiS2VubmVkeSIsMjcsMTI4LDEwXSxbIkxpbHlhbmEiLDIzLDEzNiw1XSxbIkFsYW5hIiwxMSwxMTUsNl0sWyJFbHlzZSIsMTYsMTE5LDJdLFsiSGFybGV5IiwyMywxMjQsMTRdLFsiTWljaGVsbGUiLDE3LDExNyw3XV19LHsiY29kZSI6IjJtNHY2YyIsIk4iOjE3MTgsIlAiOjMxMSwiZ3JvdXBzIjpbWyJNYWRkaXNvbiIsMCwxNCw2XSxbIlppb24iLDEsMyw1XSxbIkxhaWxhIiwyOTcsMTYzMiwxNV0sWyJKdWxpYW5uYSIsMCwzLDRdLFsiU2xvYW5lIiwwLDcsOV0sWyJDYXJhIiwxLDcsMTRdLFsiU2FyYSIsMCwzLDEyXSxbIkRhbmljYSIsMCwzLDhdLFsiQ2hhcmxpZSIsMiw1LDEwXSxbIkhheWxleSIsMCw2LDddLFsiVGF0dW0iLDEsNiwyXSxbIk1vbmljYSIsMywxMCwxXSxbIkthbGl5YWgiLDIsNSwzXSxbIkFuZ2llIiwzLDcsMTNdLFsiSmF5bGVlbiIsMSw3LDExXV19LHsiY29kZSI6IjloM3E4biIsIk4iOjE2MzgsIlAiOjMwNiwiZ3JvdXBzIjpbWyJIZWF0aGVyIiw3LDUwLDZdLFsiQWRlbGluZSIsMTAsMzgsM10sWyJIYW5uYSIsMTIsNDQsNF0sWyJKYXljZWUiLDM5LDE4MCwxM10sWyJSb3NhIiwzMSwxNDcsMTFdLFsiS2VuZHJhIiwxNCwxMDYsOV0sWyJUZWFnYW4iLDYsMjksMl0sWyJLYXRocnluIiwxNiw3OSw4XSxbIkt5cmEiLDEsMjcsMV0sWyJKYWRlIiw4LDQyLDVdLFsiS2F5ZGVuY2UiLDQyLDE1OCwxMl0sWyJBbGFubmEiLDQzLDMwMCwxNV0sWyJCaWFuY2EiLDE5LDEyNiwxMF0sWyJEYWtvdGEiLDE2LDY2LDddLFsiRWxsZSIsNDIsMjQ2LDE0XV19XQ=='));
const COLORS=['#1F77B4','#FF7F0E','#2CA02C','#D62728','#9467BD','#8C564B','#E377C2','#BCBD22','#17BECF','#AEC7E8','#FFBB78','#98DF8A','#FF9896','#C5B0D5','#F7B6D2'];
const fmt=n=>n.toLocaleString('en-US');
const app=document.getElementById('app'),block=document.getElementById('block');
const choices=[];
let roundIdx=0,finished=false;
let pid=(new URLSearchParams(location.search).get('pid')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,40);
const session=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const h=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild};
const figRow=()=>`<div style="display:flex;align-items:flex-end;gap:6px" aria-hidden="true">${['#1F77B4','#FF7F0E','#2CA02C','#8C564B','#17BECF','#FFBB78','#C3CCC7','#C3CCC7','#C3CCC7'].map(c=>`<span class="fig" style="width:34px;height:40px;background:${c}"></span>`).join('')}</div>`;

// Desktop only: needs a mouse, no phone/tablet, and a window big enough for the page.
const isDesktop=()=>matchMedia('(hover:hover) and (pointer:fine)').matches&&!/Mobi|Android|iPhone|iPad|iPod|Tablet/i.test(navigator.userAgent)&&!(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
let scale=1;
function fit(){
  scale=Math.min(1,innerWidth/819,innerHeight/980);
  app.style.transform=`scale(${scale})`;
  if(!isDesktop()){block.innerHTML='<div>This study must be done on a <b>desktop or laptop computer with a mouse</b>.<br>Please open this link on a computer.</div>';block.style.display='flex'}
  else if(scale<MIN_SCALE){block.innerHTML='<div>Your browser window is too small.<br>Please <b>maximize the window</b> (and set browser zoom to 100%) to continue.</div>';block.style.display='flex'}
  else block.style.display='none';
}
addEventListener('resize',fit);
addEventListener('beforeunload',e=>{if(choices.length&&!finished){e.preventDefault();e.returnValue=''}});

function startPage(){
  const step2=VERSION===3?'See the names of children already born there.':'See the names of children already born there. In some neighborhoods, only some of their names are public.';
  const askPid=!pid;
  app.replaceChildren(h(`<div class="page" style="padding:56px 64px;gap:30px;font-size:22px;line-height:1.5">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:500">A life simulation game</span>
      <h1 style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:54px;line-height:1.1;font-weight:600">New in the Neighborhood</h1>
    </div>
    <p style="margin:0;max-width:30em;color:#2C3A41">You are expecting a child and have just moved to a new neighborhood. Now you need to choose a name for your child from the names of children born in the neighborhood over the past few years.</p>
    <div style="display:flex;flex-direction:column;gap:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 28px">
      <span style="font-size:18px;font-weight:600;color:var(--sub)">How to play</span>
      <div style="display:flex;gap:18px"><span class="num">1</span><span><b>Move in.</b> Each round takes you to a different neighborhood, ${ROUNDS.length} in all.</span></div>
      <div style="display:flex;gap:18px"><span class="num">2</span><span><b>Look around.</b> ${step2}</span></div>
      <div style="display:flex;gap:18px"><span class="num">3</span><span><b>Name your child.</b> Pick the name you would really give your own child.</span></div>
    </div>
    ${figRow()}
    ${askPid?`<label style="display:flex;align-items:center;gap:14px;font-size:18px">Participant ID <input id="pid" autocomplete="off" style="font:inherit;font-size:18px;padding:8px 12px;border:1px solid #B4BEB9;border-radius:6px;width:220px"></label>`:''}
    <div style="flex-grow:1"></div>
    <button class="go" ${askPid?'disabled':''}>Start the game</button></div>`));
  const btn=app.querySelector('button');
  if(askPid){const inp=app.querySelector('#pid');inp.oninput=()=>{inp.value=inp.value.replace(/[^A-Za-z0-9_-]/g,'').slice(0,40);btn.disabled=!inp.value};}
  btn.onclick=()=>{if(askPid)pid=app.querySelector('#pid').value;welcomePage()};
}

function welcomePage(){
  const R=ROUNDS[roundIdx];
  app.replaceChildren(h(`<div class="page" style="padding:56px 64px;align-items:center;gap:28px;font-size:22px;line-height:1.5;text-align:center">
    <span style="align-self:flex-start;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#56656C;padding:6px 14px;border:1px solid #C3CCC7;border-radius:999px">Neighborhood ${roundIdx+1} of ${ROUNDS.length}</span>
    <div style="flex-grow:1"></div>
    <span style="font-size:40px;color:var(--sub)">${roundIdx===0?'You have just moved in.':'You have moved again.'} Welcome to</span>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:96px;line-height:1;font-weight:600;letter-spacing:.06em;color:var(--accent)">${R.code}</span>
    ${figRow()}
    <p style="margin:0;max-width:28em;color:#2C3A41">${fmt(R.N)} girls were born in this neighborhood over the past few years. Next, you will see ${VERSION===3?'their':'some of their'} names and choose a name for your own daughter.</p>
    <div style="flex-grow:1"></div>
    <button class="go">Look around</button></div>`));
  app.querySelector('button').onclick=choicePage;
}

// Grid cells of a disc, sized so that exactly N figures fill the circle.
function discCells(N,D){
  const C=D/2;let s=1.15;
  for(;;){const FW=8*s,FH=FW*7/6,all=[];
    for(let r=0;r*FH<D;r++)for(let q=0;q*FW<D;q++){const dx=q*FW+FW/2-C,dy=r*FH+FH/2-C;all.push({x:q*FW,y:r*FH,d:Math.hypot(dx,dy)})}
    all.sort((a,b)=>a.d-b.d);
    if(all.length>=N&&all[N-1].d<=C-FH*0.6)return{cells:all.slice(0,N),FW,FH};
    s*=0.985}
}
function seeded(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function choicePage(){
  const R=ROUNDS[roundIdx];
  const groups=R.groups.map(([name,pub,full],i)=>({name,count:VERSION===3?full:pub,color:COLORS[i]}));
  const P=VERSION===3?R.N:R.P;
  const D=490,C=D/2;
  const {cells,FW,FH}=discCells(R.N,D);
  const rnd=seeded(20261029+roundIdx*7919);
  const idx=cells.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  const who=new Array(R.N).fill(null);const nPub=groups.reduce((a,x)=>a+x.count,0);
  if(VERSION===1){let s=0;groups.forEach(g=>{for(let i=0;i<g.count;i++)who[idx[s+i]]=g;s+=g.count})}
  else{
    const free=new Set(idx.slice(0,nPub));
    const take=(ci,g)=>{who[ci]=g;free.delete(ci)};
    groups.map((g,i)=>i).sort((a,b)=>groups[a].count-groups[b].count).forEach(gi=>{
      const g=groups[gi];if(!g.count)return;
      const nScat=Math.round(g.count*0.4);const pool=[...free];
      for(let i=0;i<nScat&&pool.length;i++){const j=Math.floor(rnd()*pool.length);take(pool[j],g);pool.splice(j,1)}
      let rest=g.count-nScat;const H=3;
      for(let h=0;h<H&&rest>0;h++){const n=Math.ceil(rest/(H-h));rest-=n;
        const a=rnd()*2*Math.PI,r=Math.sqrt(rnd())*(C-25),hx=C+r*Math.cos(a),hy=C+r*Math.sin(a);
        const cand=[...free].map(ci=>({ci,d:Math.hypot(cells[ci].x-hx,cells[ci].y-hy)+rnd()*35}));
        cand.sort((x,y)=>x.d-y.d);cand.slice(0,n).forEach(({ci})=>take(ci,g))}
    });
  }
  const hover=VERSION!==1;
  const PUBC=hover?'#3E4A50':null, HIDC=hover?'#CBD3CF':'#C9D1CD';
  let intro,legend;
  if(VERSION===1){intro=`Only ${fmt(P)} of their names have been made public.`;
    legend=`<span style="display:flex;align-items:center;gap:8px"><span style="display:flex;gap:2px">${COLORS.slice(0,3).map(c=>`<span class="fig" style="width:20px;height:23px;background:${c}"></span>`).join('')}</span>Public: ${fmt(P)} (colour = name)</span>
      <span style="display:flex;align-items:center;gap:8px"><span class="fig" style="width:20px;height:23px;background:#B4BEB9"></span>Not public: ${fmt(R.N-P)}</span>`}
  else if(VERSION===2){intro=`Only ${fmt(P)} of their names have been made public. Move your mouse over the circle to see them.`;
    legend=`<span style="display:flex;align-items:center;gap:8px"><span class="fig" style="width:20px;height:23px;background:#3E4A50"></span>Public: ${fmt(P)} (hover to see the name)</span>
      <span style="display:flex;align-items:center;gap:8px"><span class="fig" style="width:20px;height:23px;background:#CBD3CF"></span>Not public: ${fmt(R.N-P)}</span>`}
  else{intro=`All of their names are public. Move your mouse over the circle to see them.`;
    legend=`<span style="display:flex;align-items:center;gap:8px"><span class="fig" style="width:20px;height:23px;background:#3E4A50"></span>Public: ${fmt(P)} (hover to see the name)</span>`}
  const page=h(`<div class="page" style="padding:40px 44px;gap:14px;font-size:15px;line-height:1.5">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#56656C">Neighborhood ${roundIdx+1} of ${ROUNDS.length} · ${R.code}</span></div>
    <h1 style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:30px;line-height:1.15;font-weight:600">Choose a name for your future daughter</h1>
    <p style="margin:0;color:var(--sub);max-width:66ch">${fmt(R.N)} girls were born in Neighborhood ${R.code} over the past few years.<br>${intro}</p>
    <div style="display:flex;gap:28px;align-items:center;font-size:13px;font-weight:600;color:var(--sub)">${legend}</div>
    <div class="stage" style="position:relative;width:731px;height:640px">
      <div class="disc" style="position:absolute;left:120.5px;top:75px;width:${D}px;height:${D}px;box-sizing:border-box;border-radius:50%;border:1px solid var(--line);background:#fff;${hover?'cursor:crosshair':''}"></div>
    </div>
    <button class="go" disabled style="margin-top:auto">Continue</button></div>`);
  const disc=page.querySelector('.disc'),stage=page.querySelector('.stage');
  const els=cells.map((c,i)=>{const e=document.createElement('span');e.className='fig';
    e.style.cssText=`position:absolute;left:${c.x.toFixed(2)}px;top:${c.y.toFixed(2)}px;width:${FW.toFixed(2)}px;height:${FH.toFixed(2)}px;pointer-events:none;background:${who[i]?(hover?PUBC:who[i].color):HIDC}`;
    disc.appendChild(e);return e});
  const cx=365.5,cy=320,R0=C+10;
  groups.forEach((g,i)=>{const a=-Math.PI/2+i*2*Math.PI/groups.length,Rr=R0+55*Math.abs(Math.cos(a))+16*Math.abs(Math.sin(a));
    const l=h(`<label class="pill" style="left:${(cx+Rr*Math.cos(a)).toFixed(1)}px;top:${(cy+Rr*Math.sin(a)).toFixed(1)}px">
      <input type="radio" name="pick" value="${g.name}" style="width:14px;height:14px;margin:0;accent-color:#2E5E74">
      <span style="font-weight:500;flex-grow:1">${g.name}</span>
      <span class="fig" style="width:15px;height:17.5px;flex-shrink:0;background:${g.color}"></span></label>`);
    stage.appendChild(l)});
  const btn=page.querySelector('button');
  const t0=performance.now();let hoverMs=0,lastMove=null;
  // Mouse trajectory in page coordinates (819x980 px, unaffected by zoom): "t:x:y" samples, t in ms since page shown.
  const traj=[],picks=[];let lastT=-99;
  const rec=e=>{const t=performance.now()-t0;if(t-lastT<10)return;lastT=t;const r=page.getBoundingClientRect();
    traj.push(`${Math.round(t)}:${((e.clientX-r.left)/scale).toFixed(0)}:${((e.clientY-r.top)/scale).toFixed(0)}`)};
  document.addEventListener('mousemove',rec);
  stage.addEventListener('change',e=>{btn.disabled=false;picks.push(`${Math.round(performance.now()-t0)}:${e.target.value}`)});
  btn.onclick=()=>{document.removeEventListener('mousemove',rec);
    const v=stage.querySelector('input:checked').value;const g=R.groups.find(x=>x[0]===v);
    choices.push({participant_id:pid,session,round:roundIdx+1,neighborhood:R.code,population:R.N,public:P,choice:v,choice_rank_slot:g[3],shown_count:VERSION===3?g[2]:g[1],seconds:+((performance.now()-t0)/1000).toFixed(1),hover_seconds:hover?+(hoverMs/1000).toFixed(1):'',n_pick_changes:picks.length-1,pick_sequence:picks.join(' '),scale:+scale.toFixed(3),window_w:innerWidth,window_h:innerHeight,mouse_trajectory:traj.join(' ')});
    roundIdx++;roundIdx<ROUNDS.length?welcomePage():endPage()};
  if(hover){
    const LENS=46,MAX=5,overlay=document.createElement('div');overlay.style.cssText='position:absolute;inset:0;pointer-events:none';disc.appendChild(overlay);
    let lit=[];
    const show=(mx,my)=>{
      lit.forEach(i=>els[i].style.background=PUBC);lit=[];
      const near=[];cells.forEach((c,i)=>{if(!who[i])return;const d=Math.hypot(c.x+FW/2-mx,c.y+FH/2-my);if(d<=LENS){near.push({d,c,w:who[i]});els[i].style.background=who[i].color;lit.push(i)}});
      near.sort((a,b)=>a.d-b.d);const pick=near.slice(0,MAX).sort((a,b)=>a.c.y-b.c.y);
      const TH=35,GAP=7,PITCH=TH+GAP,right=mx<=C,colX=right?mx+LENS+22:mx-LENS-22,top0=my-(pick.length*PITCH-GAP)/2;
      let html=`<div style="position:absolute;left:${mx}px;top:${my}px;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:2px solid rgba(46,94,116,.55);background:rgba(46,94,116,.05)"></div>`;
      pick.forEach(({c,w},i)=>{const ty=top0+i*PITCH,x1=c.x+FW/2,y1=c.y+FH/2,y2=ty+TH/2;
        html+=`<div class="lead" style="left:${x1}px;top:${y1}px;width:${Math.hypot(colX-x1,y2-y1)}px;background:${w.color};transform:rotate(${Math.atan2(y2-y1,colX-x1)}rad)"></div>`;
        html+=`<span class="tag" style="${right?`left:${colX}px`:`right:${D-colX}px`};top:${ty}px;border-color:${w.color}">${w.name}</span>`});
      overlay.innerHTML=html};
    let raf=0,pos=null;
    disc.addEventListener('mousemove',e=>{const r=disc.getBoundingClientRect(),k=r.width/D;pos=[(e.clientX-r.left)/k,(e.clientY-r.top)/k];
      const now=performance.now();if(lastMove)hoverMs+=Math.min(now-lastMove,200);lastMove=now;
      if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(pos)show(...pos)})});
    disc.addEventListener('mouseleave',()=>{pos=null;lastMove=null;lit.forEach(i=>els[i].style.background=PUBC);lit=[];overlay.innerHTML=''});
  }
  app.replaceChildren(page);
}

const csvCell=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
async function endPage(){
  const keys=Object.keys(choices[0]).concat('version','user_agent','finished_at');
  const extra=[VERSION,navigator.userAgent,new Date().toISOString()];
  const csv=[keys.join(',')].concat(choices.map(c=>Object.values(c).concat(extra).map(csvCell).join(','))).join('\n');
  const filename=`${pid}_v${VERSION}_${session}.csv`;
  app.replaceChildren(h(`<div class="page" style="padding:56px 64px;gap:28px;font-size:22px;line-height:1.5">
    <h1 style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:54px;line-height:1.1;font-weight:600">Saving…</h1>
    <p style="margin:0;color:#2C3A41">Please wait and do not close this page.</p></div>`));
  let ok=false;
  for(let i=0;i<3&&!ok;i++){
    try{const r=await fetch('https://pipe.jspsych.org/api/data/',{method:'POST',headers:{'Content-Type':'application/json',Accept:'*/*'},body:JSON.stringify({experimentID:DATAPIPE_ID,filename,data:csv})});ok=r.ok}catch(e){}
    if(!ok)await new Promise(r=>setTimeout(r,1500));
  }
  finished=ok;
  app.replaceChildren(h(`<div class="page" style="padding:56px 64px;gap:28px;font-size:22px;line-height:1.5">
    <h1 style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:54px;line-height:1.1;font-weight:600">${ok?'Thank you!':'Almost done'}</h1>
    <p style="margin:0;color:#2C3A41">${ok?`You have named your daughter in all ${ROUNDS.length} neighborhoods. Your responses have been saved. You may now close this page.`:`We could not save your responses automatically. Please click the button below to download them and email the file to the researcher.`}</p>
    <div style="flex-grow:1"></div>
    ${ok?'':`<button class="go" id="dl">Download responses</button>`}</div>`));
  if(!ok)app.querySelector('#dl').onclick=()=>{finished=true;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=filename;a.click()};
}
fit();
startPage();
</script>
</body>
