const vkey=n=>/^[\u0000-ɏ' -]+$/.test(n)?n.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ph/g,'f').replace(/y/g,'i').replace(/(ie|ee|ey)$/,'i').replace(/(.)\1+/g,'$1').replace(/h$/,''):n;
function setupRounds(){

  const sets={};
  for(const [sex,key] of [['girl','F'],['boy','M']]){

// Grid cells of a disc, sized so that exactly N figures fill the circle.
function discCells(N,D){
  const C=D/2;let s=4; // start large and shrink until exactly N figures fit, so they fill the circle
  for(;;){const FW=8*s,FH=FW*7/6,all=[];
    for(let r=0;r*FH<D;r++)for(let q=0;q*FW<D;q++){const dx=q*FW+FW/2-C,dy=r*FH+FH/2-C;all.push({x:q*FW,y:r*FH,d:Math.hypot(dx,dy)})}
    all.sort((a,b)=>a.d-b.d);
    if(all.length>=N&&all[N-1].d<=C-FH*0.6)return{cells:all.slice(0,N),FW,FH};
    s*=0.985}
}
function seeded(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const TUT_NAMES='ABCDEFGHIJKLMNO'.split('').map(c=>'Name '+c);
const TUT_PUB=[55,43,39,36,29,23,13,12,11,11,8,6,6,6,2]; // 300 public of 1,800
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function tutIntro(){return h(`<div class="page" style="padding:72px 64px;gap:44px;justify-content:center;font-size:22px;line-height:1.5">
  <div style="display:flex;flex-direction:column;gap:10px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:500">A life simulation game</span>
    <h1 data-t="title" style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:54px;line-height:1.1;font-weight:600;align-self:flex-start">New in the Neighborhood</h1></div>
  <div data-t="fig" style="display:flex;align-items:center;gap:22px;align-self:flex-start">${figRow()}<span style="color:#2C3A41">You are a parent<br>expecting a child.</span></div>
  <div data-t="hoods" style="display:flex;flex-direction:column;gap:12px;align-self:flex-start"><span style="font-size:18px;font-weight:600;color:var(--sub)">You will live in 8 neighborhoods</span>
    <div style="display:flex;gap:12px">${[1,2,3,4,5,6,7,8].map(i=>`<span class="num">${i}</span>`).join('')}</div></div>
  <p data-t="goal" style="margin:0;max-width:30em;color:#2C3A41;align-self:flex-start">In each neighborhood, you choose a name for your child.</p></div>`)}
function tutMoveIn(){return h(`<div class="page" style="padding:56px 64px;align-items:center;gap:28px;font-size:22px;line-height:1.5;text-align:center">
  <span data-t="badge" style="align-self:flex-start;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#56656C;padding:6px 14px;border:1px solid #C3CCC7;border-radius:999px">Neighborhood 1 of 8</span>
  <div style="flex-grow:1"></div>
  <span style="font-size:40px;color:var(--sub)">You have just moved in. Welcome to</span>
  <span data-t="code" style="font-family:'IBM Plex Mono',monospace;font-size:96px;line-height:1;font-weight:600;letter-spacing:.06em;color:var(--accent)">#1</span>
  ${figRow()}
  <p data-t="text" style="margin:0;max-width:28em;color:#2C3A41">You are expecting a <b>girl</b>. 1,800 girls were born in this neighborhood over the past few years. Next, you will see some of their names and choose a name for your own daughter.</p>
  <div style="flex-grow:1"></div>
  <button class="go" data-t="btn">Look around</button></div>`)}
// Same layout as the real look-around / choice page, with example names.
function tutRound(phase){
  const N=1800,D=596,{cells,FW,FH}=discCells(N,D),rnd=seeded(20261104),idx=shuffle(cells.map((_,i)=>i),rnd),who=new Array(N).fill(-1);
  let s=0;TUT_PUB.forEach((c,g)=>{for(let i=0;i<c;i++)who[idx[s++]]=g});
  const look=phase==='look';
  const page=h(`<div class="page" style="padding:30px 44px;gap:12px;font-size:15px;line-height:1.5">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#56656C">Neighborhood #1 of 8</span>
    <h1 data-t="title" style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:30px;line-height:1.15;font-weight:600;align-self:flex-start">${look?'Look around: which names do children here have?':'Choose a name for your future daughter'}</h1>
    <p style="margin:0;color:var(--sub)">1,800 girls were born here over the past few years. Only 300 of their names are public.</p>
    <div style="display:flex;gap:28px;align-items:center;font-size:13px;font-weight:600;color:var(--sub)">
      <span data-t="legpub" style="display:flex;align-items:center;gap:8px"><span style="display:flex;gap:2px;padding:2px 4px;background:#fff;border-radius:5px">${COLORS.slice(0,3).map(c=>`<span class="fig" style="width:20px;height:23px;background:${c}"></span>`).join('')}</span>Public: 300 (colour = name)</span>
      <span data-t="leghid" style="display:flex;align-items:center;gap:8px"><span style="display:flex;padding:2px 4px;background:#fff;border-radius:5px"><span class="fig" style="width:20px;height:23px;background:${HIDDEN}"></span></span>Not public: 1,500</span></div>
    <div class="disc" data-t="disc" style="position:relative;align-self:center;flex-shrink:0;width:${D}px;height:${D}px;box-sizing:border-box;border-radius:50%;border:1px solid var(--line);background:#fff"></div>
    <div class="stage" data-t="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px"></div></div>`);
  const disc=page.querySelector('.disc'),stage=page.querySelector('.stage');
  cells.forEach((c,i)=>{const e=document.createElement('span');e.className='fig';
    e.style.cssText=`position:absolute;left:${c.x.toFixed(2)}px;top:${c.y.toFixed(2)}px;width:${FW.toFixed(2)}px;height:${FH.toFixed(2)}px;background:${who[i]<0?HIDDEN:COLORS[who[i]]}`;disc.appendChild(e)});
  TUT_NAMES.forEach((n,g)=>stage.appendChild(h(`<label class="pill"><input type="radio" name="tutpick" value="${n}" style="width:14px;height:14px;margin:0;flex-shrink:0;accent-color:#2E5E74;visibility:${look?'hidden':'visible'}">
    <span style="font-weight:500;flex-grow:1;min-width:0;white-space:nowrap">${n}</span><span class="fig" style="width:14px;height:16px;flex-shrink:0;background:${COLORS[g]}"></span></label>`)));
  stage.appendChild(h(`<button class="go" data-t="btn" ${look?'':'disabled'} style="min-height:34px;height:34px;padding:0 10px;font-size:15px;align-self:stretch">${look?'Go to choice':'Continue'}</button>`));
  return page}
function tutWelcome(){return h(`<div class="page" style="padding:72px 64px;gap:36px;justify-content:center;font-size:22px;line-height:1.5">
  <span style="font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:500">Before you start</span>
  <h1 data-t="title" style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:54px;line-height:1.1;font-weight:600;align-self:flex-start">First, a short tutorial</h1>
  <div data-t="plan" style="display:flex;align-items:center;gap:18px;align-self:flex-start;font-size:20px;font-weight:600;color:var(--sub)">
    <span style="padding:12px 20px;background:#fff;border:1px solid var(--line);border-radius:10px">1 · Tutorial</span><span>→</span>
    <span style="padding:12px 20px;background:#fff;border:1px solid var(--line);border-radius:10px">2 · Your name and country</span><span>→</span>
    <span style="padding:12px 20px;background:#fff;border:1px solid var(--line);border-radius:10px">3 · The game</span></div></div>`)}
// Steps: [target, sentence, option]. Option 'click' shows a click on the target; 'wander' moves the pointer around
// the target until the participant clicks "I understand".
const TUT=[
  {build:tutWelcome,steps:[
    ['title','Before the game starts, a short tutorial shows you how it works, using an example neighborhood.'],
    ['plan','After the tutorial you enter your name and country, and then the real game starts.']]},
  {build:tutIntro,steps:[
    ['title','Welcome! This is a life simulation game called “New in the Neighborhood”.'],
    ['fig','In the game, you play a parent who is expecting a child.'],
    ['hoods','You will move 8 times, to 8 different neighborhoods.'],
    ['goal','In each neighborhood, you choose a name for your child. There are no right or wrong answers.']]},
  {build:tutMoveIn,steps:[
    ['badge','Step 1 · Move in. Each round starts when you move into a new neighborhood. This shows which of the 8 you are in.'],
    ['code','Neighborhoods are numbered #1 to #8, in the order you visit them.'],
    ['text','Here you learn whether you are expecting a daughter or a son, and how many children were born there.'],
    ['btn','Then click “Look around” to see the neighborhood.','click']]},
  {build:()=>tutRound('look'),steps:[
    ['title','Step 2 · Look around. First you get to know which names children in the neighborhood have.'],
    ['disc','Each small figure in the circle is one child born in this neighborhood.'],
    ['legpub','Coloured figures are children whose names are public. The colour tells you the name.'],
    ['leghid','Pale figures are children whose names are not public.'],
    ['grid','These are the public names. Each name has its own colour, so you can find it in the circle.'],
    ['disc','Look around the whole circle like this: notice which names appear, and how often.','wander'],
    ['btn','After at least 5 seconds, “Go to choice” unlocks, and you click it.','click']]},
  {build:()=>tutRound('choose'),practice:true,steps:[
    ['title','Step 3 · Choose. Now you choose a name for your own child.'],
    ['grid','Click the name you would really give your child. You can change your pick before you continue.'],
    ['btn','Then click “Continue” to move on to the next neighborhood.']],
   end:'Your turn: click any name, then click “Continue”. This is only practice and is not saved.'}];
const MIN_STEP_MS=1000; // each step stays at least 1 s before "I understand" can be clicked
const tutLog=[]; // "page.step:ms" = when each step was confirmed, ms since the tutorial started
function tutorialPage(n){
  const T=TUT[n],page=T.build();page.style.position='relative';page.style.overflow='hidden';app.replaceChildren(page);
  const block=h(`<div style="position:absolute;inset:0;z-index:4"></div>`);
  const spot=h(`<div style="position:absolute;z-index:5;left:409px;top:490px;width:0;height:0;border-radius:12px;pointer-events:none;outline:3px solid #FFE119;box-shadow:0 0 0 2000px rgba(20,30,36,.45);transition:all .5s ease"></div>`);
  const cur=h(`<svg width="30" height="34" viewBox="0 0 26 30" style="position:absolute;z-index:7;left:700px;top:930px;pointer-events:none;transition:left .8s ease,top .8s ease;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))"><path d="M2 2 L2 24 L8 18.5 L12 28 L16.5 26 L12.5 16.8 L20.5 16.8 Z" fill="#fff" stroke="#1C2830" stroke-width="2" stroke-linejoin="round"/></svg>`);
  const card=h(`<div style="position:absolute;z-index:6;left:110px;width:599px;box-sizing:border-box;padding:18px 22px;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(20,30,36,.3);font-size:20px;line-height:1.45;color:var(--ink);visibility:hidden">
    <div class="tm" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#56656C;margin-bottom:6px"></div>
    <div class="tx"></div><div class="tb" style="display:flex;justify-content:flex-end;margin-top:14px"></div></div>`);
  page.append(block,spot,cur,card);
  const tm=card.querySelector('.tm'),tx=card.querySelector('.tx'),tb=card.querySelector('.tb');
  const ok=h(`<button class="tutbtn" style="border:none;background:var(--accent);color:#fff">I understand</button>`);tb.append(ok);
  const rect=el=>{const p=page.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:(r.left-p.left)/scale,y:(r.top-p.top)/scale,w:r.width/scale,h:r.height/scale}};
  const say=(text,r,label)=>{tm.textContent=label;tx.textContent=text;tx.style.animation='none';void tx.offsetWidth;tx.style.animation='tutfade .4s ease';
    card.style.visibility='visible';const ch=card.offsetHeight,below=r.y+r.h+24;
    card.style.top=(below+ch<=964?below:Math.max(16,r.y-24-ch))+'px'};
  const point=(x,y)=>{cur.style.left=x-2+'px';cur.style.top=y-2+'px'};
  const confirm=()=>new Promise(res=>{ok.disabled=true;ok.style.opacity=.5;
    setTimeout(()=>{ok.disabled=false;ok.style.opacity=1},MIN_STEP_MS);ok.onclick=()=>{if(!ok.disabled)res()}});
  (async()=>{
    for(let i=0;i<T.steps.length;i++){
      const [t,text,opt]=T.steps[i],r=rect(page.querySelector(`[data-t="${t}"]`));
      tb.style.visibility='hidden';point(r.x+r.w/2,r.y+r.h/2);await wait(850);
      if(opt==='click'){const rp=h(`<span style="position:absolute;z-index:7;left:${r.x+r.w/2-18}px;top:${r.y+r.h/2-18}px;width:36px;height:36px;border-radius:50%;border:3px solid #FFE119;pointer-events:none;animation:tutclick .6s ease-out forwards"></span>`);page.append(rp);setTimeout(()=>rp.remove(),700)}
      Object.assign(spot.style,{left:r.x-8+'px',top:r.y-8+'px',width:r.w+16+'px',height:r.h+16+'px'});
      say(text,r,`Tutorial ${n+1} of ${TUT.length} · step ${i+1} of ${T.steps.length}`);tb.style.visibility='visible';
      let roam=null;
      if(opt==='wander'){const cx=r.x+r.w/2,cy=r.y+r.h/2,rad=r.w*0.4;let a=0;
        const move=()=>{a+=1.7+Math.random();const d=rad*(0.35+0.65*Math.random());point(cx+d*Math.cos(a),cy+d*Math.sin(a))};move();roam=setInterval(move,900)}
      await confirm();clearInterval(roam);tutLog.push(`${n+1}.${i+1}:${Math.round(performance.now()-tutT0)}`)}
    if(!T.practice){n+1<TUT.length?tutorialPage(n+1):startPage();return}
    const g=rect(page.querySelector('[data-t="grid"]'));
    Object.assign(spot.style,{left:g.x-8+'px',top:g.y-8+'px',width:g.w+16+'px',height:g.h+16+'px'});
    say(T.end,g,`Tutorial ${n+1} of ${TUT.length} · your turn`);tb.style.visibility='hidden';block.style.display='none';cur.style.opacity=0;
    const btn=page.querySelector('[data-t="btn"]');
    page.querySelector('.stage').addEventListener('change',()=>{btn.disabled=false});
    btn.onclick=()=>{tutLog.push(`${n+1}.practice:${Math.round(performance.now()-tutT0)}`);tutorialSec=+((performance.now()-tutT0)/1000).toFixed(1);startPage()};
  })()}
fit();
tutorialPage(0);
</script>
</body>
</html>
